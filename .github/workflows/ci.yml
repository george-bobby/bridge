name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - run: npm test

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
        working-directory: native/macos
